<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <title>Website Official - Dinas Komunikasi dan Informatika Provinsi Jambi</title>
  <meta name="description" content="Situs resmi Dinas Komunikasi dan Informatika Provinsi Jambi — informasi, layanan, dan pengumuman resmi." />

  <link rel="icon" href="assets/images/logo-diskominfo.png" type="image/png">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Icon Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Bootstrap -->

  <!-- Scroll Smooth -->

  <!-- Animasi CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <!-- slider owl -->
  <link rel="stylesheet" href="https://owlcarousel2.github.io/OwlCarousel2/assets/owlcarousel/assets/owl.carousel.min.css">
  <link rel="stylesheet" href="https://owlcarousel2.github.io/OwlCarousel2/assets/owlcarousel/assets/owl.theme.default.min.css">

  <!-- Style Costum -->
  <link rel="stylesheet" type="text/css" href="assets/css/costum.css">
</head>
<body>
  <div class="intro-wrapper intro-theme">
    <div class="intro-scene">
      <img src="https://diskominfo.penajamkab.go.id/wp-content/uploads/2020/02/logo-kominfo.png" class="intro-logo">
      <div class="intro-text">
        <span>D</span><span>I</span><span>S</span><span>K</span><span>O</span><span>M</span><span>I</span><span>N</span><span>F</span>
      </div>
      <div class="intro-subtitle">PROVINSI JAMBI</div>
    </div>
  </div>


  <!-- jquery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Scroll Smooth -->
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll/dist/locomotive-scroll.min.js"></script>

  <!-- Slider Owl -->
  <script src="https://owlcarousel2.github.io/OwlCarousel2/assets/owlcarousel/owl.carousel.js"></script>

  <!-- Redirect Animation -->
  <script>
    const totalAnimationDuration = 7500;
    const wrapper = document.querySelector('.intro-wrapper');

    setTimeout(() => {
      wrapper.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "beranda.html";
      }, 1800);
    }, totalAnimationDuration);
  </script>
</body>
</html>
